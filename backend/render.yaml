services:
  - type: web
    name: digitalpress-backend
    runtime: python3
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate --noinput
    startCommand: |
      gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        value: ""  # set this in Render dashboard
      - key: ALLOWED_HOSTS
        value: digitalpress-backend.onrender.com,localhost,127.0.0.1
      - key: USE_SQLITE
        value: "False"
      - key: DATABASE_URL
        value: ""  # Render will populate this when attaching a managed DB
      - key: CORS_ALLOWED_ORIGINS
        value: https://digitalpress-frontend.onrender.com,http://localhost:3000
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: WHITENOISE_STATIC_ROOT
        value: staticfiles

databases:
  - name: digitalpress-db
    databaseName: digitalpress
    user: digitalpress
    plan: free
