# Digital Press — Docker Compose (depuis le dossier backend/)
# Usage: docker compose up --build -d
# API: http://localhost:8000/api/health/

services:
  db:
    image: postgres:15-alpine
    container_name: digitalpress-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: digitalpress
      POSTGRES_USER: dp_user
      POSTGRES_PASSWORD: dp_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dp_user -d digitalpress"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: digitalpress-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    container_name: digitalpress-backend
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    volumes:
      - ./media:/app/media
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/')\""]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 45s

volumes:
  postgres_data:
  redis_data:
